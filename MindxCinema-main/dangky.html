<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftRoll</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="form-panel">
          <div class="logo">
            <img src="image/logo.png" alt="SoftRoll logo" />
            <div class="brand-text">
              <h1>
                <span class="japanese">ソフトロール</span>
                <span class="softroll">(SoftRoll)</span>
              </h1>
              <p>動画の続きを視聴するにはログインしてください</p>
              <p>Log in to continue watching.</p>
            </div>
          </div>
          <h2>(登録) Sign Up</h2>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" />

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" />

          <label class="remember-label">
            <input type="checkbox" id="registerRemember" /> Remember password
            (パスワードを記憶する)
          </label>

          <button type="button" id="registerButton">Sign Up</button>
          <p class="register-text">
            Already have an account?
            <a href="dangnhap.html">Log in</a>
          </p>
          <p class="register-text">
            すでにアカウントをお持ちですか？
            <a href="dangnhap.html"> ログイン</a>
          </p>
        </div>

      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
