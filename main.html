<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AniMindx || Home</title>

    <link rel="stylesheet" href="./css/style.css" />

    <script src="./js/config.js" defer></script>
    <script src="./js/index.js" defer></script>
  </head>

  <body class="movies-page">
    <!-- =========================
         NAVBAR
    ========================== -->
    <nav>
      <a class="brand" href="./main.html">AniMindx</a>

      <form class="movie-search" id="movie-search-form" role="search">
        <label class="sr-only" for="movie-search-input">Tìm phim hoặc anime</label>
        <input
          id="movie-search-input"
          type="search"
          placeholder="Tìm phim, anime..."
          autocomplete="off"
        />
        <button type="submit">Tìm</button>
      </form>

      <div class="user" id="currentUser">User</div>
    </nav>

    <!-- =========================
         HERO
    ========================== -->
    <section class="hero">
      <img src="./css/tqq.jpg" alt="" />

      <div class="hero-content">
        <h1 id="hero-title">Loading...</h1>

        <p id="hero-info"></p>

        <p id="hero-description"></p>

        <button id="hero-button">Watch Now</button>
      </div>
    </section>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="movies-shell">
      <section id="search-results" class="search-results" hidden aria-live="polite">
        <h2 id="search-results-title">Kết quả tìm kiếm</h2>
        <div id="search-results-list" class="movie-library search-results-grid"></div>
        <div id="search-show-more-container" class="show-more-container" hidden>
          <button id="search-show-more-btn" class="show-more-btn" type="button">
            Xem thêm
          </button>
        </div>
      </section>

      <!-- =========================
           PHIM THỊNH HÀNH
      ========================== -->
      <section class="movie-section">
        <h2 class="movies-heading">Phim thịnh hành</h2>

        <p class="movies-subtitle">
          Những bộ phim được xem nhiều nhất tuần này.
        </p>

        <section
          id="movie-list"
          class="movie-grid"
          aria-live="polite"
        ></section>
        <div id="trending-movies-more-container" class="show-more-container" hidden>
          <button id="trending-movies-more-btn" class="show-more-btn" type="button">Xem thêm</button>
        </div>
      </section>

      <!-- =========================
           ANIME THỊNH HÀNH
      ========================== -->
      <section class="anime-section">
        <h2 class="anime-heading">Anime thịnh hành</h2>

        <p class="movies-subtitle">Những bộ anime tốt nhất mọi thời đại.</p>

        <section
          id="anime-list"
          class="movie-grid"
          aria-live="polite"
        ></section>
        <div id="trending-anime-more-container" class="show-more-container" hidden>
          <button id="trending-anime-more-btn" class="show-more-btn" type="button">Xem thêm</button>
        </div>
      </section>

      <!-- =========================
           KHO PHIM
      ========================== -->
      <section class="movies">
        <h2 class="all-movies-heading">Kho phim Thịnh Hành</h2>

        <p class="movies-subtitle">Khám phá hàng trăm bộ phim.</p>

        <div id="all-movie-list" class="movie-library"></div>

        <div class="show-more-container">
          <button id="show-more-btn" class="show-more-btn">Xem thêm</button>
        </div>
      </section>

      <!-- =========================
           KHO ANIME
      ========================== -->
      <section class="anime-movies">
        <h2 class="anime-movies-heading">Kho Anime Thịnh Hành</h2>

        <p class="movies-subtitle">Khám phá hàng trăm bộ anime.</p>

        <div id="all-anime-list" class="movie-library"></div>

        <div class="show-more-container">
          <button id="show-more-anime-btn" class="show-more-btn">
            Xem thêm
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
