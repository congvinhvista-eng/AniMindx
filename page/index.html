<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniMindx || Home</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/config.js" defer></script>
    <script src="../js/index.js" defer></script>
  </head>
  <body class="movies-page">
    <nav>
      <h1>AniMindx</h1>
      <a class="btn" href="index.html">Trang chủ</a>
      <div class="user" id="currentUser">User</div>
    </nav>
    <section class="hero">
      <img src="../css/tqq.jpg" alt="" />
      <div class="hero-content">
        <h1 id="hero-title">Loading...</h1>
        <p id="hero-info"></p>
        <p id="hero-description"></p>
        <button id="hero-button">Watch Now</button>
      </div>
    </section>
    <main class="movies-shell">
      <section>
        <h2 class="movies-heading">Phim thịnh hành</h2>
        <p class="movies-subtitle">
          Những bộ phim được xem nhiều nhất tuần này.
        </p>
        <section
          id="movie-list"
          class="movie-grid"
          aria-live="polite"
        ></section>
      </section>
      <section class="anime-section">
        <h2 class="anime-heading">Anime thịnh hành</h2>
        <p class="movies-subtitle">Những bộ anime tốt nhất mọi thời đợi.</p>
        <section
          id="anime-list"
          class="movie-grid"
          aria-live="polite"
        ></section>
      </section>
      <!-- Toàn bộ phim -->
      <section class="movies">
        <h2 class="all-movies-heading">Kho phim Thịnh Hành</h2>
        <p class="movies-subtitle">Khám phá hàng trăm bộ phim.</p>
        <div id="all-movie-list" class="movie-library"></div>
        <div class="show-more-container">
          <button id="show-more-btn" class="show-more-btn">Xem thêm</button>
        </div>
      </section>
    </main>

    <section class="anime-movies">
      <h2 class="anime-movies-heading">Kho Anime Thịnh Hành</h2>
      <p class="movies-subtitle">Khám phá hàng trăm bộ anime.</p>
      <div id="all-anime-list" class="movie-library"></div>
      <div class="show-more-container">
        <button id="show-more-anime-btn" class="show-more-btn">Xem thêm</button>
      </div>
    </section>
  </body>
</html>
