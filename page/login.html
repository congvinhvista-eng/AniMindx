<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniMindx || Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/login.js" defer></script>
  </head>
  <body>
    <nav>
      <a class="brand" href="../main.html">AniMindx</a>
      <a class="btn" href="../index.html">Đăng ký</a>
    </nav>

    <main class="register-box login-box">
      <h2>Đăng nhập</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Tên đăng nhập</label>
          <input
            type="text"
            id="username"
            placeholder="Ví dụ: nguyenvana"
            required
          />
        </div>
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>
        <button type="submit" class="btn-register">Đăng nhập</button>
      </form>

      <a class="auth-switch-btn" href="../index.html">
        Chưa có tài khoản? Đăng ký
      </a>
    </main>
  </body>
</html>
